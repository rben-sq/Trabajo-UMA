<!DOCTYPE html>
<html>
    <head>
        <title>Resultado</title>
        <style>
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #e0f7fa, #cddc39); 
                padding: 30px;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh; 
                margin: 0;
            }
    
            .container {
                max-width: 700px;
                background: #fff;
                padding: 40px;
                border-radius: 15px; 
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1); 
                text-align: center;
            }
    
            h2 {
                color: #3498db;
                margin-bottom: 20px;
                font-size: 2em;
                font-weight: 500;
            }
    
            ul {
                list-style: none;
                padding: 0;
                text-align: left;
            }
    
            ul li {
                background-color: #f9f9f9;
                border: 1px solid #eee;
                padding: 10px 15px;
                margin-bottom: 8px;
                border-radius: 6px;
            }
    
            .pos-container {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 20px; 
                margin-top: 30px;
            }
    
            .pos-tag {
                display: flex;
                flex-direction: column;
                align-items: center;
                background-color: #f5f5f5; 
                padding: 15px;
                border-radius: 10px;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            }
    
            .pos-tag .tag {
                background: #e0e0e0;
                border: 2px solid #9e9e9e;
                padding: 8px 12px;
                border-radius: 8px;
                font-weight: bold;
                font-size: 1.1em;
                color: #555;
                transition: background-color 0.3s ease, border-color 0.3s ease;
            }
    
            .pos-tag .word {
                margin-top: 8px;
                font-size: 1.2em;
                color: #333;
            }
    
            .pos-tag.PRP .tag { border-color: #64b5f6; background-color: #e3f2fd; color: #1e88e5; } 
            .pos-tag.VBP .tag { border-color: #e57373; background-color: #ffebee; color: #d32f2f; } 
            .pos-tag.TO  .tag { border-color: #fff176; background-color: #fffde7; color: #fbc02d; } 
            .pos-tag.VB  .tag { border-color: #e57373; background-color: #ffebee; color: #d32f2f; } 
            .pos-tag.NNS .tag { border-color: #81c784; background-color: #e8f5e9; color: #388e3c; } 
    
            a {
                display: inline-block;
                padding: 10px 15px;
                margin-top: 20px;
                font-size: 16px;
                border-radius: 8px;
                border: 1px solid #3498db;
                color: #3498db;
                text-decoration: none;
                cursor: pointer;
                transition: background-color 0.3s ease, color 0.3s ease;
            }
    
            a:hover {
                background-color: #3498db;
                color: white;
            }
        </style>
    </head>
<body>
    <div class="container">
        <h2>Resultado</h2>
        {% if type == 'token' %}
            <ul>
                {% for sentence in result %}
                    <li>{{ sentence }}</li>
                {% endfor %}
            </ul>
        {% elif type == 'pos' %}
            <div class="pos-container">
                {% for word, tag in result %}
                    <div class="pos-tag {{ tag }}">
                        <div class="tag">{{ tag }}</div>
                        <div class="word">{{ word }}</div>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        <a href="/">Volver</a>
    </div>
</body>
</html>
